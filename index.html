<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="一个纯静态的阅读分享网站示例" />
<title>拾光阅读 · Reading Share</title>
<style>
  :root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#4f46e5;
    --accent-2:#7c3aed;
    --soft:#eef2ff;
    --shadow:0 12px 35px rgba(15,23,42,.08);
    --radius:20px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
  button,input{font:inherit}
  a{text-decoration:none;color:inherit}
  .container{width:min(1160px,92%);margin:auto}

  header{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(229,231,235,.75)}
  .nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:.5px}
  .logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 20px rgba(79,70,229,.25)}
  .nav-actions{display:flex;align-items:center;gap:10px}
  .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:13px;min-width:220px}
  .search input{border:0;outline:0;background:transparent;width:100%;color:var(--text)}
  .icon-btn,.ghost-btn,.primary-btn{border:0;cursor:pointer;border-radius:12px;padding:9px 13px;transition:.2s}
  .icon-btn{background:#fff;border:1px solid var(--line)}
  .ghost-btn{background:transparent;color:var(--muted)}
  .primary-btn{color:#fff;background:var(--accent);box-shadow:0 8px 18px rgba(79,70,229,.22)}
  .primary-btn:hover{transform:translateY(-1px);background:#4338ca}
  .icon-btn:hover,.ghost-btn:hover{background:var(--soft);color:var(--accent)}

  .hero{padding:76px 0 54px;position:relative;overflow:hidden}
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);z-index:-1}
  .hero::before{width:420px;height:420px;background:rgba(129,140,248,.18);top:-180px;left:-120px}
  .hero::after{width:340px;height:340px;background:rgba(192,132,252,.15);right:-100px;top:-80px}
  .hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}
  .eyebrow{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1.5px;text-transform:uppercase}
  h1{font-size:clamp(40px,6vw,68px);line-height:1.12;margin:14px 0 18px;letter-spacing:-2px}
  .hero p{font-size:18px;color:var(--muted);max-width:680px;margin:0 0 25px}
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap}
  .hero-panel{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.95);padding:28px;border-radius:26px;box-shadow:var(--shadow)}
  .hero-panel h3{margin:0 0 14px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .stat{padding:15px;background:#fafafa;border:1px solid var(--line);border-radius:16px}
  .stat strong{font-size:25px;display:block}
  .stat span{color:var(--muted);font-size:13px}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:20px 0 28px;flex-wrap:wrap}
  .tabs{display:flex;gap:8px;overflow:auto;padding-bottom:2px}
  .tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 14px;border-radius:999px;cursor:pointer}
  .tab.active{background:var(--text);color:#fff;border-color:var(--text)}
  .sort{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;color:var(--muted)}

  .featured{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin-bottom:26px}
  .feature-main,.feature-side{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .feature-cover{height:290px;background:linear-gradient(135deg,#312e81,#7c3aed 50%,#c4b5fd);position:relative}
  .feature-cover .cover-text{position:absolute;left:28px;bottom:24px;color:#fff;max-width:520px}
  .feature-cover h2{font-size:32px;line-height:1.25;margin:0 0 6px}
  .feature-cover p{margin:0;color:rgba(255,255,255,.82)}
  .feature-body{padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px}
  .meta{font-size:13px;color:var(--muted)}
  .mini-list{display:flex;flex-direction:column}
  .mini-item{padding:21px;border-bottom:1px solid var(--line);cursor:pointer}
  .mini-item:last-child{border-bottom:0}
  .mini-item:hover{background:#fafafa}
  .mini-item h3{margin:0 0 6px;font-size:17px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:70px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 25px rgba(15,23,42,.05);transition:.22s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(15,23,42,.1)}
  .card-cover{height:160px;display:flex;align-items:flex-end;padding:18px;color:#fff;background:linear-gradient(135deg,#0f172a,#334155)}
  .card:nth-child(2n) .card-cover{background:linear-gradient(135deg,#164e63,#0891b2)}
  .card:nth-child(3n) .card-cover{background:linear-gradient(135deg,#3f1d4c,#a855f7)}
  .tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.15);backdrop-filter:blur(5px)}
  .card-body{padding:18px;display:flex;flex-direction:column;flex:1}
  .card h3{font-size:19px;line-height:1.45;margin:0 0 8px}
  .card p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card-footer{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .actions{display:flex;gap:6px}
  .action{border:0;background:#f8fafc;color:var(--muted);width:34px;height:34px;border-radius:9px;cursor:pointer}
  .action.active{background:var(--soft);color:var(--accent)}

  footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:13px}
  .footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

  .modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal.show{display:flex}
  .reader{width:min(900px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 25px 70px rgba(15,23,42,.25)}
  .reader-cover{min-height:220px;padding:30px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:linear-gradient(135deg,#111827,#4f46e5,#a78bfa)}
  .reader-cover h2{font-size:35px;line-height:1.25;margin:10px 0 0}
  .reader-content{padding:30px 34px 38px;font-size:16px}
  .reader-content p{color:#374151}
  .reader-content blockquote{margin:22px 0;padding:15px 18px;border-left:4px solid var(--accent);background:#f5f3ff;color:#4c1d95;border-radius:8px}
  .reader-actions{position:sticky;top:0;display:flex;justify-content:flex-end;padding:13px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;background:#fff;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);padding:10px 15px;background:#111827;color:#fff;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:90;font-size:14px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:900px){
    .hero-grid,.featured{grid-template-columns:1fr}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:620px){
    .nav{height:auto;padding:12px 0;align-items:flex-start}
    .nav-actions{width:100%;flex-direction:column;align-items:stretch}
    .search{min-width:0;width:100%}
    .hero{padding-top:48px}
    .grid{grid-template-columns:1fr}
    .feature-cover{height:240px}
    .feature-body{align-items:flex-start;flex-direction:column}
    h1{letter-spacing:-1px}
    .reader-content{padding:24px 20px}
  }
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a href="#top" class="brand"><span class="logo">阅</span><span>拾光阅读</span></a>
    <div class="nav-actions">
      <label class="search" aria-label="搜索文章">
        <span>⌕</span><input id="searchInput" type="search" placeholder="搜索文章、作者、标签…" />
      </label>
      <button class="icon-btn" onclick="showFavorites()">♡ 收藏</button>
      <button class="primary-btn" onclick="scrollToArticles()">开始阅读</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="container hero-grid">
      <div>
        <div class="eyebrow">READ · THINK · SHARE</div>
        <h1>让好文章，<br>值得被慢慢读。</h1>
        <p>一个极简的阅读分享空间。记录观点、收藏灵感，也把值得分享的内容留给下一个读者。</p>
        <div class="hero-actions">
          <button class="primary-btn" onclick="scrollToArticles()">浏览文章</button>
          <button class="icon-btn" onclick="shareSite()">分享本站</button>
        </div>
      </div>
      <div class="hero-panel">
        <h3>今日阅读</h3>
        <div class="stats">
          <div class="stat"><strong id="articleCount">06</strong><span>精选文章</span></div>
          <div class="stat"><strong id="favoriteCount">00</strong><span>我的收藏</span></div>
          <div class="stat"><strong>08 min</strong><span>平均阅读</span></div>
          <div class="stat"><strong>100%</strong><span>纯静态运行</span></div>
        </div>
      </div>
    </div>
  </section>

  <section class="container" id="articles">
    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
      <select class="sort" id="sortSelect" aria-label="排序方式">
        <option value="latest">最新发布</option>
        <option value="popular">最受欢迎</option>
        <option value="title">按标题</option>
      </select>
    </div>

    <div class="featured" id="featured"></div>
    <div class="grid" id="articleGrid"></div>
  </section>
</main>

<footer>
  <div class="container footer-inner">
    <span>© 2026 拾光阅读 · A pure static HTML site</span>
    <span>无需服务器 · 无需数据库 · 数据保存在浏览器 LocalStorage</span>
  </div>
</footer>

<div class="modal" id="readerModal" aria-hidden="true">
  <article class="reader">
    <div class="reader-actions">
      <button class="icon-btn" onclick="closeReader()">✕ 关闭</button>
    </div>
    <div id="readerCover"></div>
    <div class="reader-content" id="readerContent"></div>
  </article>
</div>
<div class="toast" id="toast"></div>

<script>
const articles = [
  {
    id:1, title:'把复杂的事情，讲简单', category:'思考', author:'林默', date:'2026-08-28', reads:2480,
    excerpt:'真正清晰的表达，不是把知识讲得浅，而是把复杂系统中最重要的因果关系挑出来。',
    content:[
      '很多时候，我们以为自己需要更多信息。其实恰恰相反：我们需要的是更好的结构。',
      '复杂问题之所以难，不一定因为知识点多，而是变量之间存在依赖关系。先找到主线，再处理分支，理解会突然变得轻松。',
      '阅读技术资料也是如此。不要一上来记参数、背字段，先问三个问题：它解决什么问题？为什么要这样设计？如果没有它会发生什么？',
      '一旦建立了这条因果链，细节才会找到自己的位置。'
    ]
  },
  {
    id:2, title:'为什么我们越来越需要“慢阅读”', category:'阅读', author:'苏木', date:'2026-08-24', reads:1932,
    excerpt:'信息获取变快了，理解却没有同步变快。慢阅读，是对注意力的一种重新分配。',
    content:[
      '短内容让我们快速获得观点，却很难让观点真正沉淀。',
      '慢阅读并不是抵抗效率，而是把效率从“读得更多”切换到“理解得更深”。当一篇文章需要停下来想一想时，那些停顿本身就是阅读的一部分。',
      '可以尝试一次只读一个主题，并在阅读结束后用自己的话复述它。你会发现，真正留下来的内容通常没有想象中那么多，但也正因为如此，它们更加重要。'
    ]
  },
  {
    id:3, title:'系统设计里最容易被忽略的“为什么”', category:'技术', author:'周行', date:'2026-08-20', reads:3124,
    excerpt:'协议、架构和工程设计背后，都藏着一组对约束条件的权衡。理解权衡，才能真正理解设计。',
    content:[
      '面对一个协议字段，最有价值的问题通常不是“它是什么意思”，而是“为什么设计者认为必须存在它”。',
      '任何设计都不是孤立的。可靠性、兼容性、带宽、计算复杂度、故障恢复速度以及部署成本，都可能成为约束。',
      '因此理解系统设计时，可以反向思考：如果删除这个字段，系统在哪个边界条件下开始失效？如果换一种实现，代价是什么？这比单纯记忆定义更接近工程师真正的思维方式。'
    ]
  },
  {
    id:4, title:'给未来自己的知识地图', category:'成长', author:'南舟', date:'2026-08-16', reads:1566,
    excerpt:'知识不是散落的收藏夹，而应该逐渐形成一张能互相连接、可以反复调用的地图。',
    content:[
      '收藏一百篇文章，并不等于拥有一百篇文章的知识。真正属于你的知识，往往是那些被你连接过、应用过、解释过的内容。',
      '可以把学习过程分成三步：输入、重构、输出。输入负责扩大边界，重构负责建立关系，输出负责验证自己是否真的理解。',
      '当知识开始彼此连接，你会发现，新问题越来越像旧问题的变体。这就是知识体系开始形成的信号。'
    ]
  },
  {
    id:5, title:'一个人阅读时，如何保持长期专注', category:'生活', author:'夏川', date:'2026-08-11', reads:1098,
    excerpt:'专注并不是天生的能力，它更像一种可以被环境训练出来的工作方式。',
    content:[
      '专注最怕的不是困难，而是持续不断的切换。手机通知、网页标签、即时消息，都会让大脑付出额外的切换成本。',
      '阅读前把目标缩小一点：不是“今晚看完一本书”，而是“理解这一章解决了什么问题”。目标越具体，进入状态越容易。',
      '剩下的，就是给自己留出完整的不被打断的时间。哪怕只有二十分钟，也比一小时不断切换更有价值。'
    ]
  },
  {
    id:6, title:'分享的价值：让知识产生第二次生命', category:'分享', author:'顾言', date:'2026-08-06', reads:875,
    excerpt:'真正好的分享，不是把别人说过的话再转发一次，而是加入自己的理解与上下文。',
    content:[
      '转载可以帮助信息传播，而分享则让信息发生变化。',
      '当你把一篇文章转给朋友，并告诉他“为什么我觉得这篇值得看”，你实际上已经完成了一次理解和重构。',
      '所以，一个好的阅读分享网站，不应该只是内容的仓库，也应该成为观点发生碰撞、知识产生连接的地方。'
    ]
  }
];

const state = { category:'全部', query:'', sort:'latest', favorites:getFavorites() };

function getFavorites(){
  try{return JSON.parse(localStorage.getItem('reading_favorites') || '[]')}catch(e){return []}
}
function saveFavorites(){localStorage.setItem('reading_favorites', JSON.stringify(state.favorites)); updateCounts();}
function updateCounts(){
  document.getElementById('articleCount').textContent=String(articles.length).padStart(2,'0');
  document.getElementById('favoriteCount').textContent=String(state.favorites.length).padStart(2,'0');
}
function categories(){return ['全部',...new Set(articles.map(a=>a.category))]}
function renderTabs(){
  document.getElementById('tabs').innerHTML=categories().map(c=>`<button class="tab ${c===state.category?'active':''}" onclick="setCategory('${escapeAttr(c)}')">${c}</button>`).join('');
}
function setCategory(c){state.category=c;render();}
function filteredArticles(){
  let list=articles.filter(a=>state.category==='全部'||a.category===state.category);
  const q=state.query.trim().toLowerCase();
  if(q) list=list.filter(a=>[a.title,a.category,a.author,a.excerpt].some(v=>v.toLowerCase().includes(q)));
  if(state.sort==='latest') list.sort((a,b)=>b.date.localeCompare(a.date));
  if(state.sort==='popular') list.sort((a,b)=>b.reads-a.reads);
  if(state.sort==='title') list.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));
  return list;
}
function render(){
  renderTabs();
  const list=filteredArticles();
  const feature=document.getElementById('featured');
  if(!state.query && state.category==='全部' && list.length){
    const a=list[0], side=list.slice(1,4);
    feature.innerHTML=`
      <article class="feature-main">
        <div class="feature-cover"><div class="cover-text"><span class="tag">${a.category}</span><h2>${a.title}</h2><p>${a.excerpt}</p></div></div>
        <div class="feature-body"><div class="meta">${a.author} · ${a.date} · ${a.reads.toLocaleString()} 次阅读</div><button class="primary-btn" onclick="openReader(${a.id})">阅读全文 →</button></div>
      </article>
      <div class="feature-side">${side.map(x=>`<div class="mini-item" onclick="openReader(${x.id})"><div class="meta">${x.category} · ${x.date}</div><h3>${x.title}</h3><div class="meta">${x.author} · ${x.reads.toLocaleString()} 次阅读</div></div>`).join('')}</div>`;
  }else feature.innerHTML='';

  const grid=document.getElementById('articleGrid');
  const cards=(state.query||state.category!=='全部')?list:list.slice(1);
  if(!cards.length){
    grid.innerHTML=`<div class="empty">没有找到匹配的文章。<br>换一个关键词或分类试试看。</div>`;
    return;
  }
  grid.innerHTML=cards.map(a=>cardHTML(a)).join('');
}
function cardHTML(a){
  const fav=state.favorites.includes(a.id);
  return `<article class="card">
    <div class="card-cover"><span class="tag">${a.category}</span></div>
    <div class="card-body">
      <div class="meta">${a.author} · ${a.date}</div>
      <h3><a href="#" onclick="openReader(${a.id});return false">${a.title}</a></h3>
      <p>${a.excerpt}</p>
      <div class="card-footer">
        <span class="meta">${a.reads.toLocaleString()} 次阅读</span>
        <div class="actions">
          <button class="action ${fav?'active':''}" title="收藏" onclick="toggleFavorite(${a.id})">${fav?'♥':'♡'}</button>
          <button class="action" title="分享" onclick="shareArticle(${a.id})">↗</button>
        </div>
      </div>
    </div>
  </article>`;
}
function openReader(id){
  const a=articles.find(x=>x.id===id); if(!a)return;
  document.getElementById('readerCover').innerHTML=`<div class="reader-cover"><span class="tag">${a.category}</span><h2>${a.title}</h2><div class="meta" style="color:rgba(255,255,255,.82);margin-top:10px">${a.author} · ${a.date} · ${a.reads.toLocaleString()} 次阅读</div></div>`;
  document.getElementById('readerContent').innerHTML=`${a.content.map((p,i)=>i===1?`<blockquote>${p}</blockquote>`:`<p>${p}</p>`).join('')}<hr style="border:0;border-top:1px solid var(--line);margin:30px 0"><button class="primary-btn" onclick="toggleFavorite(${a.id});openReader(${a.id})">${state.favorites.includes(a.id)?'♥ 已收藏':'♡ 收藏这篇文章'}</button>`;
  const m=document.getElementById('readerModal');m.classList.add('show');m.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
  history.replaceState(null,'','#article-'+id);
}
function closeReader(){const m=document.getElementById('readerModal');m.classList.remove('show');m.setAttribute('aria-hidden','true');document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search)}
function toggleFavorite(id){
  if(state.favorites.includes(id)) state.favorites=state.favorites.filter(x=>x!==id); else state.favorites.push(id);
  saveFavorites(); render(); toast(state.favorites.includes(id)?'已加入收藏':'已取消收藏');
}
function showFavorites(){
  state.query='';state.category='全部';
  const list=articles.filter(a=>state.favorites.includes(a.id));
  const grid=document.getElementById('articleGrid'); document.getElementById('featured').innerHTML=''; renderTabs();
  if(!list.length){grid.innerHTML='<div class="empty">还没有收藏文章。<br>点击文章卡片上的 ♡，把值得反复阅读的内容留下来。</div>';scrollToArticles();return;}
  grid.innerHTML=list.map(a=>cardHTML(a)).join('');scrollToArticles();
}
function shareArticle(id){
  const url=location.href.split('#')[0]+'#article-'+id;
  if(navigator.share){navigator.share({title:articles.find(a=>a.id===id).title,url}).catch(()=>{})}
  else{navigator.clipboard?.writeText(url);toast('文章链接已复制');}
}
function shareSite(){
  const url=location.href.split('#')[0];
  if(navigator.share){navigator.share({title:'拾光阅读',text:'一个纯静态的阅读分享网站',url}).catch(()=>{})}
  else{navigator.clipboard?.writeText(url);toast('本站链接已复制');}
}
function scrollToArticles(){document.getElementById('articles').scrollIntoView({behavior:'smooth'});}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),1800)}
function escapeAttr(s){return s.replace(/'/g,"\\'")}

document.getElementById('searchInput').addEventListener('input',e=>{state.query=e.target.value;render()});
document.getElementById('sortSelect').addEventListener('change',e=>{state.sort=e.target.value;render()});
document.getElementById('readerModal').addEventListener('click',e=>{if(e.target.id==='readerModal')closeReader()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReader()});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#article-(\\d+)$/);if(m)openReader(Number(m[1]))});
updateCounts();render();
const initial=location.hash.match(/^#article-(\\d+)$/);if(initial)openReader(Number(initial[1]));
</script>
</body>
</html>
